name: ollama
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: ghcr.io/open-webui/open-webui:main
    container_name: ollama-app
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: ollama-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      OLLAMA_BASE_URL: http://ollama-llm:11434
      WEBUI_NAME: ${APP_ORG_NAME:-Ollama}
      WEBUI_SECRET_KEY: ${APP_SECRET_KEY:-replace-with-a-random-32-byte-hex-string}
      ANONYMOUS_TELEMETRY: 'false'
      SCARF_NO_ANALYTICS: 'true'
      DO_NOT_TRACK: 'true'
      OLLAMA_MODELS: /data/models
      ENABLE_OLLAMA_API: 'true'
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=traefik'
      - 'traefik.http.routers.ollama-app.entrypoints=http'
      - 'traefik.http.routers.ollama-app.rule=Host(`${BASE_HOST_NAME:-$HOSTNAME}`)'
      - 'traefik.http.routers.ollama-app.middlewares=ollama-app-https-redirect'
      - 'traefik.http.middlewares.ollama-app-https-redirect.redirectscheme.scheme=https'
      - 'traefik.http.routers.ollama-app-secure.entrypoints=https'
      - 'traefik.http.routers.ollama-app-secure.rule=Host(`${BASE_HOST_NAME:-$HOSTNAME}`)'
      - 'traefik.http.routers.ollama-app-secure.tls.certresolver=cloudflare'
      - 'traefik.http.routers.ollama-app-secure.service=ollama-app'
      - 'traefik.http.services.ollama-app.loadbalancer.server.port=8080'
    volumes:
      - './volumes/data/open-webui:/app/backend/data:z'
    depends_on:
      - ollama-llm
      - ollama-comfyui
    networks:
      - ollama
      - traefik

  ollama-llm:
    image: ollama/ollama:latest
    container_name: ollama-llm
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ollama-llm
    restart: always
    pull_policy: always
    logging: *default-logging
    tty: true
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: ollama-llm
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_MODELS: /data/models
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-1}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
    volumes:
      - './volumes/data/models:/data/models:z'
      - './volumes/data/ollama:/root/.ollama:z'
    devices:
      - '/dev/dri'
    networks:
      - ollama

  ollama-comfyui:
    image: ghcr.io/ai-dock/comfyui:latest
    container_name: ollama-comfyui
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ollama-comfyui
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: ollama-comfyui
      COMFYUI_ARGS: ${COMFYUI_ARGS:---cpu}
      WEB_ENABLE_AUTH: 'false'
      CF_QUICK_TUNNELS: 'false'
      USE_PERSISTENT_DATA: 'true'
      DIRECT_ADDRESS_GET_WAN: 'true'
    expose:
      - '8188'
    volumes:
      - './volumes/data/comfyui:/workspace:z'
      - './volumes/data/models:/app/models:z'
    devices:
      - '/dev/dri'
    networks:
      - ollama

networks:
  ollama:
    name: ollama
    external: false
  traefik:
    external: true
