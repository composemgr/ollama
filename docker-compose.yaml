# nginx proxy address - http://172.17.0.1:64278

name: ollama
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: ghcr.io/open-webui/open-webui:main
    container_name: ollama-app
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: ollama-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      OLLAMA_BASE_URL: http://ollama-llm:11434
      WEBUI_NAME: ${APP_ORG_NAME:-Ollama}
      WEBUI_SECRET_KEY: ${APP_SECRET_KEY:-replace-with-a-random-32-byte-hex-string}
      ANONYMOUS_TELEMETRY: 'false'
      SCARF_NO_ANALYTICS: 'true'
      DO_NOT_TRACK: 'true'
      OLLAMA_MODELS: /data/models
      ENABLE_OLLAMA_API: 'true'
    healthcheck:
      test: ['CMD-SHELL', 'curl --silent --fail http://localhost:$${PORT:-8080}/health | jq -ne ''input.status == true'' || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    ports:
      - '172.17.0.1:64278:8080'
    volumes:
      - './volumes/data/open-webui:/app/backend/data:z'
    depends_on:
      - ollama-llm
      - ollama-comfyui
    networks:
      - ollama

  ollama-llm:
    image: ollama/ollama:latest
    container_name: ollama-llm
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ollama-llm
    restart: always
    pull_policy: always
    logging: *default-logging
    tty: true
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: ollama-llm
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_MODELS: /data/models
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-1}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
    healthcheck:
      test: ['CMD', 'bash', '-c', 'exec 3<>/dev/tcp/127.0.0.1/11434']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    ports:
      - '172.17.0.1:11434:11434'
    volumes:
      - './volumes/data/models:/data/models:z'
      - './volumes/data/ollama:/root/.ollama:z'
    devices:
      - '/dev/dri'
    networks:
      - ollama

  ollama-comfyui:
    image: ghcr.io/ai-dock/comfyui:latest
    container_name: ollama-comfyui
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ollama-comfyui
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: ollama-comfyui
      COMFYUI_ARGS: ${COMFYUI_ARGS:---cpu}
      WEB_ENABLE_AUTH: 'false'
      CF_QUICK_TUNNELS: 'false'
      USE_PERSISTENT_DATA: 'true'
      DIRECT_ADDRESS_GET_WAN: 'true'
    expose:
      - '8188'
    healthcheck:
      test: ['CMD', 'curl', '-s', '-o', '/dev/null', '--max-time', '5', 'http://127.0.0.1:8188/']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - './volumes/data/comfyui:/workspace:z'
      - './volumes/data/models:/app/models:z'
    devices:
      - '/dev/dri'
    networks:
      - ollama

networks:
  ollama:
    name: ollama
    external: false
